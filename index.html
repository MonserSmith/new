<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ES Module 模块化示例</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <div id="app">
        <header>
            <h1>🧩 ES Module 模块化示例</h1>
            <p>使用 import / export 组织前端代码</p>
        </header>

        <main>
            <!-- 问候模块 -->
            <section class="card" id="greeting-section">
                <h2>👋 问候模块</h2>
                <p id="greeting-message">加载中...</p>
                <button id="greet-btn">换一个问候</button>
            </section>

            <!-- 计算器模块 -->
            <section class="card" id="calculator-section">
                <h2>🧮 计算器模块</h2>
                <div class="calc-row">
                    <input type="number" id="num1" value="10" />
                    <select id="operator">
                        <option value="add">➕ 加</option>
                        <option value="subtract">➖ 减</option>
                        <option value="multiply">✖️ 乘</option>
                        <option value="divide">➗ 除</option>
                    </select>
                    <input type="number" id="num2" value="5" />
                    <button id="calc-btn">计算</button>
                </div>
                <p id="calc-result">结果：<span>—</span></p>
            </section>

            <!-- 工具函数演示 -->
            <section class="card" id="utils-section">
                <h2>🔧 工具函数</h2>
                <p>当前时间戳：<span id="timestamp-display">—</span></p>
                <button id="timestamp-btn">刷新时间戳</button>
            </section>
        </main>

        <footer>
            <p>使用 ES Module (import / export) 构建</p>
        </footer>
    </div>

    <!-- 入口模块脚本 -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
